<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/Kanad/</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            cursor: pointer;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            outline: none;
        }
    </style>
</head>
<body>
    <video id="videoPlayer" src="yaoyiyao.mp4" autoplay loop playsinline></video>
    <script>
        const video = document.getElementById('videoPlayer');
        video.muted = false;
        video.play().catch(() => {
            const enableAudioAndPlay = () => {
                video.muted = false;
                video.play();
                window.removeEventListener('click', enableAudioAndPlay);
                window.removeEventListener('touchstart', enableAudioAndPlay);
            };
            window.addEventListener('click', enableAudioAndPlay);
            window.addEventListener('touchstart', enableAudioAndPlay);
        });
    </script>

</body>
</html>
